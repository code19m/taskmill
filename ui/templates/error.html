{{define "error.html"}}{{template "head" .}}
<header class="topbar"><h1>{{.Title}}</h1></header>
<div class="page">
<section class="card error-card">
  <p>{{.Data.Message}}</p>
  <a class="btn" href="{{path .Data.Back}}">{{template "icon" "back"}}{{.Data.BackLabel}}</a>
</section>
</div>
{{template "foot" .}}{{end}}
