name: Release

# A maintainer pushes a tag vX.Y.Z, and this publishes the release: see
# CONTRIBUTING.md#releasing. Tags of nested modules, such as otel/v0.1.0, do
# not match, since those modules have no binaries.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      packages: write # push the image
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      IMAGE: ghcr.io/code19m/taskmill-ui
    steps:
      # The tag name reaches shell commands below: accept only a version.
      - name: Check the tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::The tag is not a version such as v1.0.0 or v1.0.0-rc.1."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser and the check below read the tags and main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # The binaries carry the standard library: build with its latest patches.
          check-latest: true
          cache: false # A release builds from nothing, so no cache can taint it.
      # A guard against mistakes; the tag ruleset decides who may push tags.
      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main: release from main only."; exit 1; }
      - name: Log in to the container registry
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Builds and uploads everything as a draft release, and pushes the
      # image as X.Y.Z.
      - run: make release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - name: Find the image digest
        id: image
        run: |
          digest=$(jq -er 'first(.[] | select(.type == "Docker Manifest") | .extra.Digest)' dist/artifacts.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the archives and SBOMs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # storage records need an organization's repository
      - name: Tag the image latest
        if: ${{ !contains(github.ref_name, '-') }} # not for a pre-release
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
