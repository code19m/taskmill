name: Release

# A maintainer pushes a tag vX.Y.Z, and this publishes the release: see
# CONTRIBUTING.md#releasing. Tags of nested modules, such as otel/v0.1.0, do
# not match, since those modules have no binaries.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      packages: write # push the image
      id-token: write # sign the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser and the check below read the tags and main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # The binaries carry the standard library: build with its latest patches.
          check-latest: true
          cache: false # A release builds from nothing, so no cache can taint it.
      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main: release from main only."; exit 1; }
      - name: Log in to the container registry
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Builds and uploads everything, as a draft release.
      - run: make release TAG="$GITHUB_REF_NAME"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Find the image digest
        id: image
        run: |
          digest=$(jq -er 'first(.[] | select(.type == "Docker Manifest") | .extra.Digest)' dist/artifacts.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the archives and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/code19m/taskmill-ui
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # storage records need an organization's repository
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
