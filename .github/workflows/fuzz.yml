name: Fuzz

# Every test run replays the fuzz targets' seeds. This runs the fuzzers
# themselves, each for a few minutes, to find new failing input.
on:
  schedule:
    - cron: "0 4 * * *" # Daily.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make db
      - run: make fuzz FUZZTIME=3m
      # A failing input is written to testdata/fuzz in its package. Commit it
      # with the fix, or add it to the target's seeds.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/"
