name: Faults

# The fault scenarios of docs/design/benchmarks.md, F1 to F7 at a tenth of
# their size and F9, against databases of their own. They take about 10
# minutes: too long for every pull request, so they run nightly, and on pull
# requests that change them. F8 runs on every pull request, in CI.
on:
  schedule:
    - cron: "17 2 * * *"
  pull_request:
    paths:
      - internal/cmd/bench/**
      - .github/workflows/faults.yml
  workflow_dispatch:

permissions: {}

# A new push to a pull request cancels the run of the push before it. Every
# other run is grouped by its commit, as in ci.yml, so that no run cancels
# the run of another commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  faults:
    name: Fault scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make faults
