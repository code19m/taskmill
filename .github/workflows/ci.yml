name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly, so newly published vulnerabilities surface without a commit.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs a Makefile target, so `make check` reproduces CI locally.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
      - run: make tidy-check lint

  test:
    name: Test (Go ${{ matrix.go }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The go.mod version against every supported PostgreSQL, and the
        # newest Go against the newest PostgreSQL to catch breakage early.
        include:
          - { go: go.mod, postgres: 15 }
          - { go: go.mod, postgres: 16 }
          - { go: go.mod, postgres: 17 }
          - { go: go.mod, postgres: 18 }
          - { go: stable, postgres: 18 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          check-latest: true
          cache-dependency-path: go.sum
      # The same database as `make db` locally, with the same settings.
      - run: make db TEST_POSTGRES=postgres:${{ matrix.postgres }}-alpine
      - run: make test

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # Scan against the patched standard library users should run.
          check-latest: true
          cache-dependency-path: |
            go.sum
            Makefile
      - run: make vuln
