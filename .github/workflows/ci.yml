name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Weekly, so newly published vulnerabilities surface without a commit.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs a Makefile target, so `make check` reproduces CI locally,
# except the GoReleaser job: `make release-check`.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: | # one cache per job, so that each job can save its own
            go.sum
            Makefile
            .golangci.yml
      - run: make tidy-check lint

  test:
    name: Test (Go ${{ matrix.go }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local # test the Go of the matrix, not the toolchain line of go.mod
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Go against every supported PostgreSQL, and the
        # newest Go against the newest PostgreSQL to catch breakage early.
        include:
          - { go: "1.26.x", postgres: 15 }
          - { go: "1.26.x", postgres: 16 }
          - { go: "1.26.x", postgres: 17 }
          - { go: "1.26.x", postgres: 18 }
          - { go: stable, postgres: 18 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: go.sum
      # The same database as `make db` locally, with the same settings.
      - run: make db TEST_POSTGRES=postgres:${{ matrix.postgres }}-alpine
      - run: make test

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # Scan against the patched standard library users should run.
          check-latest: true
          cache-dependency-path: |
            go.sum
            Makefile
      - run: make vuln

  # Apart from lint, since it builds GoReleaser: a broken config fails here,
  # not at a release.
  release-check:
    name: Release config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            Makefile
            .goreleaser.yaml
      # The notes recipe runs under CI's make on every pull request, not first
      # at a release.
      - name: Check the release notes recipe
        env:
          TAG: v0.1.0
        run: test "$(make -s release-notes | head -n 1)" = "Initial release."
      - run: make release-check

  # The one check that branch protection requires, so that changing the
  # matrix needs no change to the repository's settings.
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, vuln, release-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Every check passed."
