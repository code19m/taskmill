# GoReleaser builds taskmill-ui's release: the binaries and their archives,
# checksums, SBOMs, and the container image. The release workflow runs
# `make release` for a pushed tag, and `make snapshot` builds the same into
# ./dist without publishing anything. See docs/design/releasing.md.
version: 2

project_name: taskmill-ui

builds:
  - main: ./cmd/taskmill-ui
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Reproducible: the same commit and Go build the same bytes. The binary
    # reads its version from the build information Go embeds, so the
    # linker sets nothing.
    flags: [-trimpath]
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - format_overrides:
      - goos: windows
        formats: [zip]
    # The archives are reproducible too: no file takes its owner or time
    # from the machine that builds it.
    builds_info: &info
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *info

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

kos:
  - repositories: [ghcr.io/code19m/taskmill-ui]
    bare: true
    # Static, with CA certificates and time zones, and nothing else.
    # Dependabot does not update the digest: see docs/design/releasing.md.
    base_image: gcr.io/distroless/static-debian13:nonroot@sha256:18f4cc26c9ffa7f20a359298be7deadac5c607c8e03a02b8119f1a5fc2f82c99
    user: "65532:65532"
    platforms: [linux/amd64, linux/arm64]
    # The release workflow moves latest once the image is attested.
    tags: ["{{ .Version }}"]
    creation_time: "{{ .CommitTimestamp }}"
    annotations:
      org.opencontainers.image.source: https://github.com/code19m/taskmill
      org.opencontainers.image.description: taskmill's web dashboard
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"

changelog:
  disable: true # the notes come from CHANGELOG.md

release:
  prerelease: auto
  # The release workflow publishes the draft once the attestations exist.
  draft: true
  replace_existing_draft: true
